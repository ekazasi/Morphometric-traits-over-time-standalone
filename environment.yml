name: morphometrics_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.5.2
  - r-phytools=2.5_2
  - r-rphylopars=0.3.10
  - r-vegan=2.7_3
  - r-viridis=0.6.5
  - r-plotly=4.12.0
  - r-shiny=1.13.0
  - r-ggplot2=4.0.2
  - r-dplyr=1.2.0
  - bioconductor-ggtree=4.0.4
  - r-biocmanager=1.30.27
  - r-remotes

# geomorph, mvMORPH and RRPP have no conda-forge/bioconda distribution
# Install them from CRAN's version archive after activating this
  # environment, to keep exact version pinning intact:
  #   R -e 'remotes::install_version("geomorph", version = "4.1.0")'
  #   R -e 'remotes::install_version("mvMORPH",  version = "1.2.1")'
  #   R -e 'remotes::install_version("RRPP",     version = "2.1.2")'